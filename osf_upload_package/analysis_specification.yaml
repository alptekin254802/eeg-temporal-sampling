preprocessing:
  offline_reference: linked_mastoids_mean_TP9_TP10
  fragment_specific_filtering: forbidden
  resampling: none
  spectral_outcome_adaptive_rejection: forbidden
roi:
  name: posterior
  channels: [O1, Oz, O2]
spectral_estimator:
  elementary_window_seconds: 4
  elementary_windows_per_arm: 10
  detrend: linear
  taper: periodic_hann_sym_false
  fft_length_samples: four_seconds_times_native_sampling_rate
  zero_padding: false
  one_sided_density: true
  frequency_spacing_hz: 0.25
  aggregation_order:
    - mean_ten_periodograms_within_channel
    - mean_three_posterior_channel_psds
    - integrate_bands
    - numerator_divided_by_denominator
marker:
  name: posterior_relative_alpha
  numerator_hz: [8, 13]
  denominator_hz: [1, 30]
  edge_rule: inclusive
  integration: trapezoidal
regimes:
  C:
    public_name: contiguous_sampling
    construction: one_contiguous_ten_cell_block
    retained_seconds: 40
  F5:
    public_name: intermediate_distributed_sampling
    construction: five_distributed_two_cell_blocks
    strata_sizes_cells: [9, 9, 8, 8, 8]
    minimum_unselected_cells_between_blocks: 1
    retained_seconds: 40
  F10:
    public_name: highly_distributed_sampling
    construction: one_cell_from_each_of_ten_ordered_strata
    strata_sizes_cells: [5, 5, 4, 4, 4, 4, 4, 4, 4, 4]
    additional_interwindow_gap_across_strata: none
    adjacent_cells_across_stratum_boundaries_permitted: true
    retained_seconds: 40
sampling:
  draws_per_regime: 200
  schedule_rng: deterministic_sha256_derived
  additional_global_seed: none
  hash_seed_template: AUX004|dataset|participant|regime|replicate|arm_label
  hash_namespace_note: historical_namespace_retained_verbatim_to_reproduce_the_prespecified_schedule
  hash_to_seed: first_64_bits_sha256_big_endian
  numpy_rng: default_rng
  deterministic_candidate_enumeration_order: python_sequence_order
  constructions:
    C: enumerate_legal_ten_cell_blocks_select_A_uniformly_then_B_uniformly_from_disjoint_conditional_pool
    F5: enumerate_legal_configurations_select_A_uniformly_then_draw_B_candidates_with_replacement_until_disjoint
    F5_maximum_B_attempts: 100000
    F5_failure_rule: participant_excluded_if_any_required_draw_fails_no_partial_schedule_no_repair
    F10: per_stratum_A_then_B_from_same_stratum_excluding_A
    F10_arm_labels: [A0, B0, A1, B1, A2, B2, A3, B3, A4, B4, A5, B5, A6, B6, A7, B7, A8, B8, A9, B9]
  arms_nonoverlapping_within_replicate: true
  draws_with_replacement_across_replicates: true
  participant_adaptation: eligible_mask_only
  spectral_adaptation: forbidden
  sampling_schedule:
    path: structural/ds005385_sampling_schedule.npz
    sha256: 95c0da1f105ff9f92a64010d120b8ebecc760c75540b448f209dc391e91649c1
    shape: [531, 3, 200, 2, 10]
    dtype: uint8
